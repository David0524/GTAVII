<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c0b0a" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />
    <title>Tenderloin '74</title>
    <style>
      html, body { margin: 0; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; height: 100%; background: #0c0b0a; overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      /* The 3D view is sized by CSS to the whole layout viewport; the engine reads its real size every frame
         (iOS Safari reports stale innerWidth on rotation and may not fire resize again). */
      #app > canvas.t74-view { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
      #attribution { position: fixed; right: calc(8px + env(safe-area-inset-right)); bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 7; color: #d8d2c4cc; font-size: 11px; text-shadow: 0 1px 2px #000; pointer-events: auto; }
      #attribution a { color: inherit; }
      body.touch #attribution { bottom: auto; top: calc(10px + env(safe-area-inset-top)); right: calc(56px + env(safe-area-inset-right)); font-size: 9px; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #e0d6c0; letter-spacing: .2em; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">TENDERLOIN '74 — LOADING</div>
    <div id="attribution">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL) · NYC Open Data</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
